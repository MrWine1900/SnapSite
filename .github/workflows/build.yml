name: SnapSite Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build & Verify (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project SnapSite.xcodeproj \
            -scheme SnapSite \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Build succeeded
        run: echo "✅ SnapSite compiled successfully on Xcode 16.2 / iOS Simulator!"
